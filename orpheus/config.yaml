# Orpheus TTS Server Configuration
# Environment variables override these settings

server:
  host: "0.0.0.0"
  port: 8080
  workers: 1  # Single worker for GPU
  debug: false
  cors_enabled: true
  max_request_size: 10485760  # 10MB
  request_timeout: 60  # seconds
  keepalive_timeout: 5

model:
  name: "canopylabs/orpheus-tts-0.1-finetune-prod"
  max_model_len: 2048
  dtype: "bfloat16"
  device: "cuda"  # cuda or cpu
  trust_remote_code: true
  
  # vLLM optimization settings
  gpu_memory_utilization: 0.95  # Use 95% of VRAM
  enforce_eager: false  # Allow CUDA graphs
  enable_prefix_caching: true
  enable_chunked_prefill: true
  max_num_seqs: 256
  tensor_parallel_size: 1  # For multi-GPU
  swap_space: 4  # GB of CPU swap
  disable_log_stats: true  # Reduce overhead

generation:
  default_voice: "tara"
  default_temperature: 0.6
  default_top_p: 0.8
  default_repetition_penalty: 1.3
  default_max_tokens: 2000
  stop_token_ids: [128258]
  
  # Voice-specific settings
  voice_settings:
    tara:
      temperature: 0.6
      top_p: 0.8
    leo:
      temperature: 0.65
      top_p: 0.85
    mia:
      temperature: 0.55
      top_p: 0.75
    whisper:
      temperature: 0.4
      top_p: 0.7
    shout:
      temperature: 0.8
      top_p: 0.9

performance:
  warmup_on_start: true
  warmup_samples: 3
  cache_enabled: true
  cache_size: 10
  max_concurrent_requests: 10
  max_text_length: 5000
  enable_torch_compile: false  # Experimental
  
  # Streaming settings
  chunk_size: 4096
  stream_buffer_size: 16384
  flush_immediately: true

monitoring:
  stats_window_size: 100
  log_level: "INFO"
  log_requests: true
  log_performance: true
  metrics_endpoint: "/metrics"
  health_check_interval: 30  # seconds

audio:
  sample_rate: 24000
  bits_per_sample: 16
  channels: 1
  codec: "pcm"  # pcm, wav, mp3
  
  # SNAC decoder settings
  snac_device: "cuda"
  snac_batch_size: 1

limits:
  max_batch_size: 10
  max_text_chars: 5000
  max_generation_time: 60  # seconds
  rate_limit:
    enabled: false
    requests_per_minute: 60
    burst_size: 10

deployment:
  environment: "production"  # development, staging, production
  gpu_type: "rtx4090"
  min_vram_gb: 12
  cuda_version: "12.1"
  pytorch_version: "2.0.0"
  
  # vast.ai specific
  vastai:
    instance_type: "RTX 4090"
    docker_image: "pytorch/pytorch:2.0.0-cuda12.1-cudnn8-runtime"
    open_ports: [8080, 22]
    disk_space_gb: 50
    ssh_enabled: true

# Feature flags
features:
  voice_cloning: true
  emotion_tags: true
  batch_processing: true
  websocket_streaming: true
  audio_caching: true
  metrics_collection: true
  
# Paths
paths:
  model_cache: "/tmp/model_cache"
  audio_cache: "/tmp/audio_cache"
  logs: "/var/log/orpheus"
  outputs: "./output"