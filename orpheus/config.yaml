# Orpheus TTS Configuration
# All settings for the TTS service

model:
  name: canopylabs/orpheus-tts-0.1-finetune-prod
  max_model_len: 64000  # Maximum context length for model
  max_tokens: 64000     # FIXED: Was 2000, now 64000 for 12+ minutes of audio!
  dtype: bfloat16       # Model precision (bfloat16 recommended for RTX 4090)

server:
  host: 0.0.0.0         # Listen on all interfaces
  port: 8080            # Server port
  workers: 1            # Number of workers

audio:
  sample_rate: 24000    # Output sample rate (24kHz for Orpheus)
  channels: 1           # Mono audio
  bits_per_sample: 16   # 16-bit PCM

generation:
  temperature: 0.6      # Controls randomness (0.0-1.0)
  top_p: 0.8           # Nucleus sampling threshold
  repetition_penalty: 1.3  # Penalty for repeated tokens

# Voice options
voices:
  - tara    # Female, neutral
  - leah    # Female, warm
  - jess    # Female, energetic
  - leo     # Male, deep
  - dan     # Male, neutral
  - mia     # Female, young
  - zac     # Male, casual
  - zoe     # Female, professional

# Performance settings
performance:
  gpu_memory_utilization: 0.95  # How much GPU memory to use
  enable_prefix_caching: true    # Speed up similar prompts
  enable_chunked_prefill: true   # Better streaming performance
  max_num_seqs: 256             # Maximum concurrent sequences
  tensor_parallel_size: 1       # Number of GPUs for tensor parallelism

# Limits
limits:
  max_text_length: 10000        # Maximum input text length
  max_audio_duration_seconds: 771  # ~64000 tokens / 83 tokens per second
  tokens_per_second: 83         # Approximate tokens per second of audio