<!DOCTYPE html>
<html>
<head>
    <title>Orpheus TTS - WebSocket Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            min-height: 50px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🎵 Orpheus TTS</h1>
    
    <div>
        <label>Server:</label>
        <input type="text" id="server" value="localhost:8080" placeholder="e.g., localhost:8080">
    </div>
    
    <div>
        <label>Text:</label>
        <textarea id="text" rows="4">Hello, this is a test of the Orpheus text to speech system.</textarea>
    </div>
    
    <div>
        <label>Voice:</label>
        <select id="voice">
            <option value="tara">Tara</option>
            <option value="leah">Leah</option>
            <option value="mia">Mia</option>
            <option value="leo">Leo</option>
            <option value="dan">Dan</option>
        </select>
    </div>
    
    <div>
        <label>
            <input type="checkbox" id="streamMode"> Stream Mode (play while downloading) - CURRENTLY DEBUGGING
        </label>
    </div>
    
    <div>
        <button id="generateBtn" onclick="generate()">Generate Speech</button>
        <button onclick="stopAudio()">Stop</button>
    </div>
    
    <div id="status">Ready</div>
    
    <audio id="audio" controls></audio>
    
    <script>
        let ws = null;
        let audioChunks = [];
        let isGenerating = false;
        let audioContext = null;
        let nextStartTime = 0;
        let isPlaying = false;
        let scheduledSources = [];
        let nextChunkToPlay = 0;
        let chunkBuffer = new Map(); // Store chunks by index
        
        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }
        
        function generate() {
            if (isGenerating) return;
            
            const server = document.getElementById('server').value;
            const text = document.getElementById('text').value;
            const voice = document.getElementById('voice').value;
            const streamMode = document.getElementById('streamMode').checked;
            
            if (!text.trim()) {
                setStatus('Please enter some text');
                return;
            }
            
            isGenerating = true;
            document.getElementById('generateBtn').disabled = true;
            setStatus('Connecting...');
            
            // Reset
            audioChunks = [];
            isPlaying = false;
            nextStartTime = 0;
            nextChunkToPlay = 0;
            chunkBuffer.clear();
            
            // Initialize audio context for streaming mode
            if (streamMode && !audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 24000,
                    latencyHint: 'interactive'
                });
            }
            
            // Connect
            ws = new WebSocket(`ws://${server}/ws`);
            
            ws.onopen = () => {
                setStatus('Generating...');
                
                // Send request
                ws.send(JSON.stringify({
                    text: text,
                    voice: voice,
                    max_tokens: 64000  // Max length!
                }));
            };
            
            ws.onmessage = (event) => {
                // Handle JSON messages
                if (typeof event.data === 'string') {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'audio_chunk') {
                        // Debug: Log chunk order
                        const chunkIndex = data.chunk;
                        console.log(`Received chunk ${chunkIndex}: ${data.data.length} chars`);
                        
                        // Decode base64 to binary
                        const binary = atob(data.data);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) {
                            bytes[i] = binary.charCodeAt(i);
                        }
                        
                        const streamMode = document.getElementById('streamMode').checked;
                        
                        if (streamMode) {
                            // CRITICAL: Store chunk with its EXACT index
                            chunkBuffer.set(chunkIndex, bytes);
                            
                            // Debug info
                            const bufferStatus = `Buffer: ${chunkBuffer.size} chunks, waiting for #${nextChunkToPlay}`;
                            console.log(bufferStatus);
                            setStatus(`Streaming... (received chunk ${chunkIndex}, playing from ${nextChunkToPlay})`);
                            
                            // Only start playing if we have the first chunks
                            if (chunkBuffer.has(0) && !isPlaying) {
                                console.log('Have chunk 0, starting playback');
                                playBufferedChunksInOrder();
                            } else if (isPlaying) {
                                // Continue playing if we already started
                                playBufferedChunksInOrder();
                            } else {
                                console.log(`Still waiting for chunk 0, have chunks: ${Array.from(chunkBuffer.keys()).sort((a,b) => a-b).join(', ')}`);
                            }
                        } else {
                            // Buffer mode: collect for later
                            audioChunks.push(bytes);
                            setStatus(`Receiving audio... (${audioChunks.length} chunks)`);
                        }
                        
                    } else if (data.type === 'complete') {
                        const streamMode = document.getElementById('streamMode').checked;
                        if (streamMode) {
                            setStatus('Streaming complete');
                        } else {
                            setStatus('Processing audio...');
                            playCollectedAudio();
                        }
                        ws.close();
                        isGenerating = false;
                        document.getElementById('generateBtn').disabled = false;
                    } else if (data.error) {
                        setStatus(`Error: ${data.error}`);
                        ws.close();
                        isGenerating = false;
                        document.getElementById('generateBtn').disabled = false;
                    }
                }
            };
            
            ws.onerror = (error) => {
                setStatus('Connection error');
                isGenerating = false;
                document.getElementById('generateBtn').disabled = false;
            };
            
            ws.onclose = () => {
                if (isGenerating) {
                    setStatus('Connection closed unexpectedly');
                    isGenerating = false;
                    document.getElementById('generateBtn').disabled = false;
                }
            };
        }
        
        function playBufferedChunksInOrder() {
            // Play all consecutive chunks we have
            let played = 0;
            while (chunkBuffer.has(nextChunkToPlay)) {
                const bytes = chunkBuffer.get(nextChunkToPlay);
                console.log(`Playing chunk ${nextChunkToPlay} (${bytes.length} bytes)`);
                playStreamingChunk(bytes);
                chunkBuffer.delete(nextChunkToPlay);
                nextChunkToPlay++;
                played++;
            }
            if (played > 0) {
                console.log(`Played ${played} chunks, next expected: ${nextChunkToPlay}`);
            }
        }
        
        function playStreamingChunk(bytes) {
            if (!audioContext) return;
            
            // Resume context if suspended
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            // Initialize playback timing on first chunk
            if (!isPlaying) {
                isPlaying = true;
                nextStartTime = audioContext.currentTime + 0.01; // Minimal buffer for fastest start
            }
            
            // Convert raw PCM bytes to audio buffer - FAST method
            const arrayBuffer = bytes.buffer;
            const dataView = new DataView(arrayBuffer);
            const frameCount = arrayBuffer.byteLength / 2; // 16-bit samples
            
            // Create audio buffer
            const audioBuffer = audioContext.createBuffer(1, frameCount, 24000);
            const channelData = audioBuffer.getChannelData(0);
            
            // Fast conversion: Int16 PCM to Float32
            for (let i = 0; i < frameCount; i++) {
                const sample = dataView.getInt16(i * 2, true); // little-endian
                channelData[i] = sample / 32768.0;
            }
            
            // Create and immediately schedule buffer source
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            
            // Start playing THIS chunk at the scheduled time
            source.start(nextStartTime);
            
            // Update next start time for GAPLESS playback
            nextStartTime += audioBuffer.duration;
            
            // Store source for cleanup
            scheduledSources.push(source);
            source.onended = () => {
                const index = scheduledSources.indexOf(source);
                if (index > -1) {
                    scheduledSources.splice(index, 1);
                }
            };
            
            // Save chunk for potential replay
            audioChunks.push(bytes);
        }
        
        function playCollectedAudio() {
            if (audioChunks.length === 0) {
                setStatus('No audio received');
                return;
            }
            
            // Combine all chunks
            let totalLength = 0;
            audioChunks.forEach(chunk => totalLength += chunk.length);
            
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            audioChunks.forEach(chunk => {
                combined.set(chunk, offset);
                offset += chunk.length;
            });
            
            // Create WAV header (16-bit PCM, 24kHz, mono)
            const wavHeader = createWavHeader(combined.length);
            
            // Combine header + audio
            const wavFile = new Uint8Array(wavHeader.length + combined.length);
            wavFile.set(wavHeader, 0);
            wavFile.set(combined, wavHeader.length);
            
            // Create blob and play
            const blob = new Blob([wavFile], { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(blob);
            
            const audio = document.getElementById('audio');
            audio.src = audioUrl;
            audio.play();
            
            const sizeKB = (blob.size / 1024).toFixed(1);
            const durationSec = (combined.length / 2 / 24000).toFixed(1);
            setStatus(`Ready - Generated ${durationSec}s of audio (${sizeKB}KB)`);
        }
        
        function createWavHeader(dataLength) {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);
            
            // "RIFF"
            view.setUint32(0, 0x52494646, false);
            // File size - 8
            view.setUint32(4, 36 + dataLength, true);
            // "WAVE"
            view.setUint32(8, 0x57415645, false);
            // "fmt "
            view.setUint32(12, 0x666d7420, false);
            // Chunk size
            view.setUint32(16, 16, true);
            // Audio format (1 = PCM)
            view.setUint16(20, 1, true);
            // Channels (1 = mono)
            view.setUint16(22, 1, true);
            // Sample rate (24000)
            view.setUint32(24, 24000, true);
            // Byte rate
            view.setUint32(28, 24000 * 2, true);
            // Block align
            view.setUint16(32, 2, true);
            // Bits per sample
            view.setUint16(34, 16, true);
            // "data"
            view.setUint32(36, 0x64617461, false);
            // Data size
            view.setUint32(40, dataLength, true);
            
            return new Uint8Array(buffer);
        }
        
        function stopAudio() {
            // Stop regular audio
            document.getElementById('audio').pause();
            
            // Stop all scheduled streaming audio
            scheduledSources.forEach(source => {
                try {
                    source.stop();
                } catch (e) {
                    // Source might have already ended
                }
            });
            scheduledSources = [];
            
            // Reset streaming state
            isPlaying = false;
            nextStartTime = 0;
            
            // Close WebSocket
            if (ws) {
                ws.close();
                ws = null;
            }
            
            setStatus('Stopped');
        }
        
        // Allow Enter key to generate
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                generate();
            }
        });
    </script>
</body>
</html>
