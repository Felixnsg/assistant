<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orpheus TTS TRUE Streaming Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 10px;
        }
        
        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #44ff44;
        }
        
        .status-dot.streaming {
            background: #ffaa00;
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .audio-player {
            background: #f8f8f8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .streaming-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            color: white;
        }
        
        .streaming-indicator.active {
            display: flex;
        }
        
        .stream-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .stream-progress {
            height: 100%;
            background: white;
            animation: stream 2s linear infinite;
        }
        
        @keyframes stream {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 10px;
        }
        
        .metric {
            text-align: center;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        
        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 150px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .presets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .preset-btn {
            padding: 8px;
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .preset-btn:hover {
            border-color: #667eea;
            background: #f8f8ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Orpheus TTS TRUE Streaming</h1>
            <div class="subtitle">Real-time audio streaming with immediate playback!</div>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
            <div>
                <span id="serverUrl">Not configured</span>
            </div>
        </div>
        
        <div class="main-card">
            <!-- Server Configuration -->
            <div class="input-section">
                <h3>🔧 WebSocket Configuration</h3>
                <div class="input-group">
                    <label for="serverInput">Server Address (IP:Port)</label>
                    <input type="text" id="serverInput" placeholder="e.g., 79.117.27.229:8080" value="79.117.27.229:8080">
                </div>
                <div class="controls">
                    <div>
                        <label for="streamingMode">Streaming Mode:</label>
                        <select id="streamingMode">
                            <option value="immediate">Immediate (Play ASAP)</option>
                            <option value="buffer">Buffer 3 chunks</option>
                            <option value="complete">Wait for complete</option>
                        </select>
                    </div>
                </div>
                <button class="btn-secondary" onclick="connect()">Connect WebSocket</button>
                <button class="btn-secondary" onclick="disconnect()">Disconnect</button>
            </div>
            
            <!-- Main Input -->
            <div class="input-section">
                <h3>📝 Text Input</h3>
                <div class="input-group">
                    <label for="textInput">Enter your text:</label>
                    <textarea id="textInput" placeholder="Type or paste your text here...">True streaming! Audio plays immediately as chunks arrive!</textarea>
                </div>
                
                <!-- Quick Presets -->
                <label>Quick Presets:</label>
                <div class="presets">
                    <button class="preset-btn" onclick="setText('Hello world!')">Short</button>
                    <button class="preset-btn" onclick="setText('This is true streaming. Audio starts playing immediately!')">Medium</button>
                    <button class="preset-btn" onclick="setText('The quick brown fox jumps over the lazy dog. ' + 'This sentence tests all letters. '.repeat(3))">Long Test</button>
                    <button class="preset-btn" onclick="setText('Testing streaming performance with a longer passage. ' + 'Each chunk should play as soon as it arrives. '.repeat(5))">Performance Test</button>
                </div>
            </div>
            
            <!-- Voice Settings -->
            <div class="controls">
                <div>
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect">
                        <option value="tara">Tara (Female)</option>
                        <option value="leah">Leah (Female)</option>
                        <option value="jess">Jess (Female)</option>
                        <option value="mia">Mia (Female)</option>
                        <option value="zoe">Zoe (Female)</option>
                        <option value="leo">Leo (Male)</option>
                        <option value="dan">Dan (Male)</option>
                        <option value="zac">Zac (Male)</option>
                    </select>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="button-group">
                <button class="btn-primary" id="generateBtn" onclick="generateSpeech()" disabled>
                    🎵 Stream Audio
                </button>
                <button class="btn-secondary" onclick="stopAudio()">⏹️ Stop</button>
            </div>
            
            <!-- Audio Player -->
            <div class="audio-player">
                <h3>🔊 Audio Output</h3>
                <audio id="audioPlayer" controls></audio>
                <div class="streaming-indicator" id="streamingIndicator">
                    <span>STREAMING</span>
                    <div class="stream-bar">
                        <div class="stream-progress"></div>
                    </div>
                </div>
                <div id="audioStatus" style="margin-top: 10px; color: #666;">Ready</div>
            </div>
            
            <!-- Metrics -->
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="ttfbMetric">-</div>
                    <div class="metric-label">TTFB (ms)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="chunksMetric">0</div>
                    <div class="metric-label">Chunks</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="playbackMetric">0</div>
                    <div class="metric-label">Playback (s)</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="bufferMetric">0</div>
                    <div class="metric-label">Buffered</div>
                </div>
            </div>
            
            <!-- Log -->
            <div class="log" id="logContainer">
                <div class="log-entry">🚀 TRUE Streaming Dashboard ready!</div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let mediaSource = null;
        let sourceBuffer = null;
        let audioChunks = [];
        let startTime = null;
        let chunkCount = 0;
        let isPlaying = false;
        let pendingChunks = [];
        let firstChunkReceived = false;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const savedServer = localStorage.getItem('orpheus_ws_server');
            if (savedServer) {
                document.getElementById('serverInput').value = savedServer;
            }
        });
        
        // Connect to WebSocket
        function connect() {
            const server = document.getElementById('serverInput').value;
            if (!server) {
                alert('Please enter server address');
                return;
            }
            
            if (ws) {
                ws.close();
            }
            
            const wsUrl = `ws://${server}/ws`;
            log(`Connecting to WebSocket: ${wsUrl}`);
            
            try {
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';
                
                ws.onopen = () => {
                    log('✅ WebSocket connected!');
                    updateStatus(true, 'Connected');
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('serverUrl').textContent = server;
                    localStorage.setItem('orpheus_ws_server', server);
                };
                
                ws.onmessage = (event) => {
                    handleMessage(event);
                };
                
                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`);
                    updateStatus(false, 'Error');
                };
                
                ws.onclose = () => {
                    log('WebSocket disconnected');
                    updateStatus(false, 'Disconnected');
                    document.getElementById('generateBtn').disabled = true;
                };
                
            } catch (error) {
                log(`❌ Failed to connect: ${error.message}`);
                updateStatus(false, 'Failed');
            }
        }
        
        // Disconnect WebSocket
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        // Handle incoming messages
        async function handleMessage(event) {
            if (event.data instanceof ArrayBuffer) {
                // Binary audio data
                chunkCount++;
                
                // Track TTFB
                if (!firstChunkReceived) {
                    firstChunkReceived = true;
                    const ttfb = Date.now() - startTime;
                    document.getElementById('ttfbMetric').textContent = ttfb;
                    log(`🎵 First audio chunk! TTFB: ${ttfb}ms`);
                    document.getElementById('streamingIndicator').classList.add('active');
                }
                
                // Update metrics
                document.getElementById('chunksMetric').textContent = chunkCount;
                
                // Handle based on streaming mode
                const mode = document.getElementById('streamingMode').value;
                
                if (mode === 'immediate') {
                    // Play immediately
                    playChunkImmediately(event.data);
                } else if (mode === 'buffer') {
                    // Buffer a few chunks before playing
                    pendingChunks.push(event.data);
                    document.getElementById('bufferMetric').textContent = pendingChunks.length;
                    
                    if (pendingChunks.length >= 3 && !isPlaying) {
                        startBufferedPlayback();
                    }
                } else {
                    // Wait for complete
                    audioChunks.push(event.data);
                }
                
                document.getElementById('audioStatus').textContent = `Streaming... (chunk ${chunkCount})`;
                
            } else {
                // JSON message
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'complete') {
                        log(`✅ Stream complete! ${data.chunks || chunkCount} chunks received`);
                        document.getElementById('streamingIndicator').classList.remove('active');
                        
                        if (document.getElementById('streamingMode').value === 'complete') {
                            playAllChunks();
                        } else if (pendingChunks.length > 0) {
                            // Play remaining buffered chunks
                            flushBuffer();
                        }
                        
                        document.getElementById('audioStatus').textContent = 'Complete';
                        document.getElementById('generateBtn').disabled = false;
                    } else if (data.error) {
                        log(`❌ Error: ${data.error}`);
                        document.getElementById('streamingIndicator').classList.remove('active');
                        document.getElementById('generateBtn').disabled = false;
                    }
                } catch (e) {
                    log(`Message: ${event.data}`);
                }
            }
        }
        
        // Play chunk immediately (true streaming)
        function playChunkImmediately(audioData) {
            // For immediate playback, we need to handle raw PCM data
            // Create a mini WAV for each chunk or use Web Audio API
            
            const audio = document.getElementById('audioPlayer');
            
            if (!isPlaying) {
                // Start with first chunk
                isPlaying = true;
                const blob = createAudioBlob([audioData]);
                audio.src = URL.createObjectURL(blob);
                audio.play();
            } else {
                // Append to queue for seamless playback
                pendingChunks.push(audioData);
                // Use Media Source Extensions for true streaming
                // For now, we'll batch small groups
                if (pendingChunks.length >= 2) {
                    const blob = createAudioBlob(pendingChunks);
                    pendingChunks = [];
                    // Queue next audio
                    audio.addEventListener('ended', () => {
                        audio.src = URL.createObjectURL(blob);
                        audio.play();
                    }, { once: true });
                }
            }
        }
        
        // Start buffered playback
        function startBufferedPlayback() {
            if (isPlaying) return;
            isPlaying = true;
            
            const audio = document.getElementById('audioPlayer');
            const blob = createAudioBlob(pendingChunks.splice(0, 3));
            audio.src = URL.createObjectURL(blob);
            audio.play();
            
            // Continue playing remaining chunks
            audio.addEventListener('ended', () => {
                if (pendingChunks.length > 0) {
                    const nextBlob = createAudioBlob(pendingChunks.splice(0, Math.min(3, pendingChunks.length)));
                    audio.src = URL.createObjectURL(nextBlob);
                    audio.play();
                }
            });
        }
        
        // Flush remaining buffer
        function flushBuffer() {
            if (pendingChunks.length > 0) {
                const audio = document.getElementById('audioPlayer');
                const blob = createAudioBlob(pendingChunks);
                pendingChunks = [];
                
                if (!audio.paused && !audio.ended) {
                    audio.addEventListener('ended', () => {
                        audio.src = URL.createObjectURL(blob);
                        audio.play();
                    }, { once: true });
                } else {
                    audio.src = URL.createObjectURL(blob);
                    audio.play();
                }
            }
        }
        
        // Play all chunks (complete mode)
        function playAllChunks() {
            if (audioChunks.length === 0) return;
            
            const audio = document.getElementById('audioPlayer');
            const blob = createAudioBlob(audioChunks);
            audioChunks = [];
            audio.src = URL.createObjectURL(blob);
            audio.play();
        }
        
        // Create audio blob with WAV header
        function createAudioBlob(chunks) {
            // Combine chunks
            const totalLength = chunks.reduce((acc, chunk) => acc + chunk.byteLength, 0);
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            
            for (const chunk of chunks) {
                combined.set(new Uint8Array(chunk), offset);
                offset += chunk.byteLength;
            }
            
            // Add WAV header
            const sampleRate = 24000;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + totalLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, totalLength, true);
            
            const wavFile = new Uint8Array(44 + totalLength);
            wavFile.set(new Uint8Array(wavHeader), 0);
            wavFile.set(combined, 44);
            
            return new Blob([wavFile], { type: 'audio/wav' });
        }
        
        // Generate speech
        function generateSpeech() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket not connected');
                return;
            }
            
            const text = document.getElementById('textInput').value;
            const voice = document.getElementById('voiceSelect').value;
            
            if (!text) {
                alert('Please enter some text');
                return;
            }
            
            // Reset state
            audioChunks = [];
            pendingChunks = [];
            chunkCount = 0;
            isPlaying = false;
            firstChunkReceived = false;
            startTime = Date.now();
            
            // Update UI
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('chunksMetric').textContent = '0';
            document.getElementById('ttfbMetric').textContent = '-';
            document.getElementById('bufferMetric').textContent = '0';
            document.getElementById('audioStatus').textContent = 'Requesting...';
            
            // Update status dot for streaming
            document.getElementById('statusDot').classList.add('streaming');
            
            // Send request
            const request = {
                text: text,
                voice: voice
            };
            
            log(`🎤 Requesting: "${text.substring(0, 30)}..." [${document.getElementById('streamingMode').value} mode]`);
            ws.send(JSON.stringify(request));
        }
        
        // Stop audio
        function stopAudio() {
            const audio = document.getElementById('audioPlayer');
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
            pendingChunks = [];
            audioChunks = [];
            document.getElementById('streamingIndicator').classList.remove('active');
            document.getElementById('statusDot').classList.remove('streaming');
            log('Audio stopped');
        }
        
        // Set preset text
        function setText(text) {
            document.getElementById('textInput').value = text;
        }
        
        // Update connection status
        function updateStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            
            dot.classList.remove('streaming');
            if (connected) {
                dot.classList.add('connected');
            } else {
                dot.classList.remove('connected');
            }
            text.textContent = message;
        }
        
        // Logging
        function log(message) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            while (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
        }
        
        // Update playback time
        setInterval(() => {
            const audio = document.getElementById('audioPlayer');
            if (!audio.paused && !audio.ended) {
                document.getElementById('playbackMetric').textContent = audio.currentTime.toFixed(1);
            }
        }, 100);
    </script>
</body>
</html>
