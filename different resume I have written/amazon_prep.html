        // Global variables for tracking state
        let currentScenario = 0;
        let userSelections = Array(scenarios.length).fill(null);

        // Initialize on page load
        window.onload = function() {
            displayScenario(currentScenario);
            updateNavButtons();
        };

        // Display the current scenario
        function displayScenario(index) {
            const scenario = scenarios[index];
            const container = document.getElementById('scenarioContainer');
            
            let optionsHTML = '';
            scenario.options.forEach((option, i) => {
                const letter = String.fromCharCode(65 + i); // A, B, C, D
                const selectedClass = userSelections[index] && userSelections[index].optionIndex === i ? 
                    `option ${userSelections[index].rank}` : 'option';
                
                optionsHTML += `
                    <div class="${selectedClass}" onclick="selectOption(${index}, ${i})">
                        <strong>${letter}:</strong> ${option.text}
                        <div class="lp-tag">${option.lpTags}</div>
                    </div>`;
            });
            
            const feedbackStyle = userSelections[index] ? 'display: block;' : 'display: none;';
            const feedbackHTML = `
                <div class="feedback" id="feedback-${index}" style="${feedbackStyle}">
                    <p><strong>Feedback:</strong></p>
                    ${getFeedbackContent(index)}
                </div>`;
            
            container.innerHTML = `
                <div class="scenario">
                    <div class="scenario-title">${index + 1}. ${scenario.title}</div>
                    <div class="situation">${scenario.situation}</div>
                    <div class="options">${optionsHTML}</div>
                    ${feedbackHTML}
                </div>
            `;
            
            document.getElementById('progress').textContent = `Scenario ${index + 1} of ${scenarios.length}`;
        }
        
        // Get feedback content for the specified scenario
        function getFeedbackContent(index) {
            if (!userSelections[index]) return '';
            
            const scenario = scenarios[index];
            const bestIndex = scenario.options.findIndex(opt => opt.rank === 'best');
            const worstIndex = scenario.options.findIndex(opt => opt.rank === 'worst');
            
            const bestLetter = String.fromCharCode(65 + bestIndex);
            const worstLetter = String.fromCharCode(65 + worstIndex);
            
            return `
                <p><strong>Best Answer:</strong> Option ${bestLetter} - ${scenario.options[bestIndex].lpTags}</p>
                <p><strong>Worst Answer:</strong> Option ${worstLetter} - ${scenario.options[worstIndex].lpTags}</p>
                <p>${scenario.solution}</p>
            `;
        }
        
        // Handle option selection
        function selectOption(scenarioIndex, optionIndex) {
            const scenario = scenarios[scenarioIndex];
            const rank = scenario.options[optionIndex].rank;
            
            userSelections[scenarioIndex] = {
                optionIndex: optionIndex,
                rank: rank
            };
            
            displayScenario(scenarioIndex);
            
            // Show feedback
            const feedback = document.getElementById(`feedback-${scenarioIndex}`);
            if (feedback) {
                feedback.style.display = 'block';
            }
        }
        
        // Navigate to next scenario
        function nextScenario() {
            if (currentScenario < scenarios.length - 1) {
                currentScenario++;
                displayScenario(currentScenario);
            } else {
                showFinalScore();
            }
            updateNavButtons();
        }
        
        // Navigate to previous scenario
        function previousScenario() {
            if (currentScenario > 0) {
                currentScenario--;
                displayScenario(currentScenario);
            }
            updateNavButtons();
        }
        
        // Update the navigation button states
        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentScenario === 0;
            
            if (currentScenario === scenarios.length - 1) {
                nextBtn.textContent = 'Finish';
            } else {
                nextBtn.textContent = 'Next';
            }
        }
        
        // Show the final score
        function showFinalScore() {
            // Count best and worst selections
            let bestCount = 0;
            let worstCount = 0;
            
            userSelections.forEach(selection => {
                if (selection) {
                    if (selection.rank === 'best') {
                        bestCount++;
                    } else if (selection.rank === 'worst') {
                        worstCount++;
                    }
                }
            });
            
            // Update score display
            document.getElementById('bestCount').textContent = bestCount;
            document.getElementById('worstCount').textContent = worstCount;
            
            // Hide scenario container and show score section
            document.getElementById('scenarioContainer').style.display = 'none';
            document.querySelector('.navigation').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
            document.getElementById('scoreSection').style.display = 'block';
        }
        
        // Restart the assessment
        function restartAssessment() {
            currentScenario = 0;
            userSelections = Array(scenarios.length).fill(null);
            
            // Reset display
            document.getElementById('scenarioContainer').style.display = 'block';
            document.querySelector('.navigation').style.display = 'flex';
            document.getElementById('progress').style.display = 'block';
            document.getElementById('scoreSection').style.display = 'none';
            
            displayScenario(currentScenario);
            updateNavButtons();
        }
    </script>
