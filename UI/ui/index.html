<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypher Assistant UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark"> <!-- Default theme -->

    <div class="container">
        <!-- The main circle element -->
        <div id="main-circle" class="circle"></div>

        <!-- Status indicator area below the circle -->
        <div id="status-indicator">
            <!-- Mic icon (default state, shown when not user speaking) -->
            <div id="mic-icon" class="indicator active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" aria-label="Microphone Icon">
                    <!-- Font Awesome Free 6.5.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc. -->
                    <path fill="currentColor" d="M192 0C139 0 96 43 96 96V256c0 53 43 96 96 96s96-43 96-96V96c0-53-43-96-96-96zM64 216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 89.1 66.2 162.7 152 174.4V464H120c-13.3 0-24 10.7-24 24s10.7 24 24 24h144c13.3 0 24-10.7 24-24s-10.7-24-24-24H216V430.4c85.8-11.7 152-85.3 152-174.4V216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 70.7-57.3 128-128 128s-128-57.3-128-128V216z"/>
                </svg>
            </div>
            <!-- Oscillating circles (shown when user is speaking) -->
            <div id="oscillating-circles" class="indicator">
                <div class="osc-circle osc-circle-1"></div>
                <div class="osc-circle osc-circle-2"></div>
                <div class="osc-circle osc-circle-3"></div>
            </div>
        </div> <!-- End status-indicator -->

        <!-- Transcription display area -->
        <div id="transcription-area" class="hidden"> <!-- Starts hidden -->
            <div id="user-text" aria-live="polite"></div> <!-- Aria-live for screen readers -->
            <div id="ai-text" aria-live="polite"></div>   <!-- Aria-live for screen readers -->
        </div> <!-- End transcription-area -->

    </div> <!-- End container -->

    <!-- Control buttons -->
    <div class="controls">
        <button id="toggle-text-btn" title="Toggle Transcription Visibility">📄</button>
        <div class="theme-buttons" role="group" aria-label="Select Theme">
            <button class="theme-btn" data-theme="theme-dark" title="Dark Theme" aria-label="Apply Dark Theme"></button>
            <button class="theme-btn" data-theme="theme-light" title="Light Theme" aria-label="Apply Light Theme"></button>
            <button class="theme-btn" data-theme="theme-blue" title="Blue Theme" aria-label="Apply Blue Theme"></button>
            <button class="theme-btn" data-theme="theme-purple" title="Purple Theme" aria-label="Apply Purple Theme"></button>
            <button class="theme-btn" data-theme="theme-red" title="Red Theme" aria-label="Apply Red Theme"></button>
            <!-- Add more theme buttons here, ensure they have corresponding CSS -->
        </div>
    </div> <!-- End controls -->

    <script src="script.js"></script>
</body>
</html>
